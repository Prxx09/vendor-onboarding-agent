[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "vendor-onboarding-agent"
version = "0.1.0"
description = "Agentic foundation for vendor onboarding"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.7",
    "pydantic-settings>=2.2",
    "groq>=0.9",
    "supabase>=2.4",
    "PyMuPDF>=1.24",
    "pypdf>=4.2",
    "python-docx>=1.1",
    "pdfplumber>=0.11",
    "rapidfuzz>=3.9",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.5"]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.setuptools.package-data]
"app.prompts" = ["*.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integration: requires a configured Supabase project"]
addopts = "-p no:tmpdir -p no:cacheprovider"

[tool.ruff]
line-length = 100
target-version = "py311"
exclude = [".venv", "pip-ephem-wheel-cache-*", ".pytest-temp", "pytest-cache-files-*"]
